name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build and lint tools
        run: python -m pip install build ruff
      - name: Lint and check repository contracts
        run: |
          ruff check .
          ruff format --check .
          python scripts/check_repo.py
      - name: Build distributions
        run: python -m build
      - name: Smoke test installed wheel without model dependencies
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c 'import importlib.metadata, oumi_weights_lab, oumi_weights_lab.cli; assert oumi_weights_lab.__version__ == importlib.metadata.version("oumi-weights-lab")'
          "$RUNNER_TEMP/wheel-smoke/bin/oumi-weights-lab" --help

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            dependencies: latest
          - python-version: "3.11"
            dependencies: minimum
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install latest CPU dependencies
        if: matrix.dependencies == 'latest'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[adapters]' pytest pyyaml
      - name: Install minimum supported CPU dependencies
        if: matrix.dependencies == 'minimum'
        run: |
          python -m pip install 'torch==2.4.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[adapters]' 'transformers==4.56.0' 'safetensors==0.4.3' 'peft==0.13.0' pytest pyyaml
          python -m pip check
      - name: Full unit suite
        if: matrix.dependencies == 'latest'
        run: pytest -q
      - name: Minimum dependency model and adapter checks
        if: matrix.dependencies == 'minimum'
        run: >-
          pytest -q tests/test_local_model.py tests/test_adapter.py tests/test_loading.py
          tests/test_persistence.py tests/test_scoring.py tests/test_interventions.py
          tests/test_budget.py
