[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weights-lab"
version = "0.1.0"
description = "A persistent Python workspace for exploring open language models"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["torch>=2.4", "transformers>=4.56,<6"]

[project.optional-dependencies]
adapters = ["peft>=0.13"]
remote = ["build>=1.2"]
modal = ["modal>=1.6"]

[project.scripts]
weights-lab = "weights_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/weights_lab"]

[tool.hatch.build.targets.sdist]
include = ["src/weights_lab", "tests", "examples", "scripts", "skills", ".claude-plugin", "docs/api.md", "docs/remote.md", "docs/dogfood.md", "docs/parity.md", "docs/qwen-replay.md", "docs/skill-install.md", "docs/validation.md", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["F821"]
